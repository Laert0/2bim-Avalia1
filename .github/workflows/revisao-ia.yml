
name: Revisao de codigo por IA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar configuracao do token
        env:
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_PAT" ]; then
            echo "::error::O segredo COPILOT_PAT nao esta configurado."
            exit 1
          fi
          echo "Segredo COPILOT_PAT encontrado."

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Revisar codigo com IA
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          git fetch origin main

          copilot -p "Revise as alteracoes entre origin/main e HEAD. Use git diff origin/main...HEAD para identificar as mudancas. Aponte possiveis erros, problemas de seguranca e melhorias. Responda em portugues." \
            -s \
            --allow-tool='shell(git:*)' \
            --no-ask-user > revisao.md

          if [ ! -s revisao.md ]; then
            echo "::error::A revisao por IA nao gerou resultado."
            exit 1
          fi

          cat revisao.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar revisao no pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const revisao = fs.readFileSync('revisao.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## Revisao de codigo por IA\n\n' + revisao
            });
