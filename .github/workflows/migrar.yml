
name: migrar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'wrangler.toml'

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar configuração do Wrangler
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::error::Arquivo wrangler.toml não encontrado na branch main."
            exit 1
          fi

      - name: Aplicar migrações D1
        run: npx --yes wrangler d1 migrations apply 2bim-avalia1-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
