```yaml
name: migrar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - 'wrangler.toml'

jobs:
  aplicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar arquivos necessários
        run: |
          if [ ! -f wrangler.toml ]; then
            echo "::error::Arquivo wrangler.toml não encontrado na raiz da branch main."
            exit 1
          fi

          if [ ! -d migrations ]; then
            echo "::error::Pasta migrations não encontrada."
            exit 1
          fi

          if [ ! -f migrations/0001_inicial.sql ]; then
            echo "::error::Arquivo migrations/0001_inicial.sql não encontrado."
            exit 1
          fi

      - name: Instalar Wrangler
        run: npm install --global wrangler

      - name: Validar configuração do Wrangler
        run: wrangler d1 info 2bim-avalia1-db --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Aplicar migrações D1
        run: wrangler d1 migrations apply 2bim-avalia1-db --remote --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
```
